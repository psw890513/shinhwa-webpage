<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>접수 내역 | (주)신화건설기계 관리자</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="container">
      <a href="../index.html" class="logo">신화건설기계 <small>관리자</small></a>
      <nav class="admin-nav">
        <a href="index.html">제품 관리</a>
        <a href="inquiries.html" aria-current="page">접수 내역</a>
        <a href="../index.html" target="_blank" rel="noopener">사이트 보기</a>
        <button id="logout-btn" class="btn-small btn-header" type="button" hidden>로그아웃</button>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">

      <!-- 로그인 화면 -->
      <section id="login-view" class="card login-card" hidden>
        <h1>관리자 로그인</h1>
        <div id="config-warning" class="notice notice-warn" hidden>
          Firebase 설정이 아직 없습니다. js/firebase-config.js 를 먼저 채워 주세요.
        </div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" required autocomplete="username">
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <p id="login-error" class="error" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block">로그인</button>
        </form>
      </section>

      <!-- 권한 없음 -->
      <section id="denied-view" class="card login-card" hidden>
        <h1>접근 권한이 없습니다</h1>
        <p>이 계정은 관리자로 등록되어 있지 않습니다. 관리자에게 문의해 주세요.</p>
        <button id="denied-logout-btn" class="btn btn-primary btn-block" type="button">다른 계정으로 로그인</button>
      </section>

      <!-- 관리자 앱 -->
      <div id="app-view" hidden>
        <h1>접수 내역</h1>

        <section class="card">
          <div class="toolbar">
            <div>
              <span id="summary" class="hint"></span>
            </div>
            <div style="display:flex; gap:.5rem; align-items:center;">
              <label for="status-filter" class="hint">상태</label>
              <select id="status-filter">
                <option value="all">전체</option>
                <option value="new">신규</option>
                <option value="in_progress">진행 중</option>
                <option value="done">완료</option>
              </select>
              <button id="refresh-btn" class="btn-small" type="button">새로고침</button>
            </div>
          </div>
          <div id="admin-notice" class="notice" hidden></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>접수일시</th>
                  <th>회사명 / 성명</th>
                  <th>연락처</th>
                  <th>필요 장비</th>
                  <th>임대 기간</th>
                  <th>문의 내용</th>
                  <th>상태</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="inquiry-rows"></tbody>
            </table>
          </div>
        </section>
      </div>

    </div>
  </main>

  <script type="module" src="common.js"></script>
  <script type="module" src="inquiries.js"></script>
</body>
</html>
