<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>콘텐츠 관리 | (주)신화건설기계 관리자</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <header class="admin-header">
    <div class="container">
      <a href="../index.html" class="logo">신화건설기계 <small>관리자</small></a>
      <nav class="admin-nav">
        <a href="index.html" aria-current="page">콘텐츠 관리</a>
        <a href="inquiries.html">견적 요청 관리</a>
        <a href="../index.html" target="_blank" rel="noopener">사이트 보기</a>
        <button id="logout-btn" class="btn-small btn-header" type="button" hidden>로그아웃</button>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      <!-- 로그인 화면 -->
      <section id="login-view" class="card login-card" hidden>
        <h1>관리자 로그인</h1>
        <div id="config-warning" class="notice notice-warn" hidden>
          Firebase 설정이 아직 없습니다. js/firebase-config.js 를 먼저 채워 주세요.
        </div>
        <form id="login-form" novalidate>
          <div class="field">
            <label for="email">이메일</label>
            <input id="email" name="email" type="email" required autocomplete="username">
          </div>
          <div class="field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
          </div>
          <p id="login-error" class="error" role="alert"></p>
          <button type="submit" class="btn btn-primary btn-block">로그인</button>
        </form>
      </section>

      <!-- 권한 없음 -->
      <section id="denied-view" class="card login-card" hidden>
        <h1>접근 권한이 없습니다</h1>
        <p>이 계정은 관리자로 등록되어 있지 않습니다. 관리자에게 문의해 주세요.</p>
        <button id="denied-logout-btn" class="btn btn-primary btn-block" type="button">다른 계정으로 로그인</button>
      </section>

      <div id="app-view" hidden>
      <h1>콘텐츠 관리</h1>

      <div id="admin-notice" class="notice" hidden></div>

      <div class="inq-tabs" role="tablist" aria-label="콘텐츠 종류">
        <button class="inq-tab" type="button" role="tab" data-tab="products" aria-selected="true">장비</button>
        <button class="inq-tab" type="button" role="tab" data-tab="notices" aria-selected="false">공지사항</button>
        <button class="inq-tab" type="button" role="tab" data-tab="company" aria-selected="false">회사 정보</button>
        <button class="inq-tab" type="button" role="tab" data-tab="banner" aria-selected="false">배너</button>
      </div>

      <section id="panel" class="card" aria-live="polite">
        <p class="hint">불러오는 중…</p>
      </section>
      </div>
    </div>
  </main>

  <div id="save-bar" class="save-bar" hidden>
    <div class="container save-bar-inner">
      <span>저장하지 않은 변경이 있습니다.</span>
      <div class="save-bar-actions">
        <button id="revert-btn" type="button" class="btn-small">되돌리기</button>
        <button id="save-btn" type="button" class="btn btn-primary btn-inline">저장</button>
      </div>
    </div>
  </div>

  <script type="module" src="content.js"></script>
</body>
</html>
